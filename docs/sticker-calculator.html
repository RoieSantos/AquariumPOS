<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Stickers - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    .calculator-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    .calculator-frame-wrap {
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .calculator-frame-wrap h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--panel-border);
    }
    .calculator-frame-wrap iframe {
      width: 100%;
      height: calc(100vh - 260px);
      min-height: 640px;
      border: none;
      display: block;
    }
    @media (max-width: 1100px) {
      .calculator-grid {
        grid-template-columns: 1fr;
      }
      .calculator-frame-wrap iframe {
        height: 900px;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div id="topnav"></div>

  <div class="page">
    <h1>Custom Stickers</h1>
    <p class="muted">
      Client-side calculator only - nothing here is saved to the database.
      Same pricing as the desktop POS app's Custom Stickers feature (Plain/Tiles/Rubber Matting/Glass/Acrylic/Allum TopCover).
    </p>
    <div class="calculator-grid">
      <div class="calculator-frame-wrap">
        <h2>Sticker</h2>
        <iframe src="WebAquariumCalculator/sticker.html" title="Custom Sticker Calculator"></iframe>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    (async function () {
      const session = await requireAuth();
      if (!session) return;
      renderTopNav('Custom Stickers');
    })();
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
