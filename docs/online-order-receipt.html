<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Pet Stop - Order Confirmation</title>
  <!-- The sheet itself (letterhead | order + branch, receiver, products, notice | totals) is shared with the
       two Invoice pages - css/orderDocument.css + js/orderDocument.js. -->
  <link rel="stylesheet" href="css/orderDocument.css?v=1">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      color: #1f2a37;
      font-size: 13px;
    }
    .page { max-width: 820px; margin: 0 auto; padding: 20px 14px 32px; }
    .status-message {
      background: #fff; border: 1px solid #c9d3e1; border-radius: 8px;
      padding: 18px; text-align: center; color: #5b6b80;
    }
    .toolbar { text-align: center; margin-top: 16px; }
    .toolbar button {
      background: #1d4f91; color: #fff; border: none; border-radius: 6px;
      padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hint { text-align: center; color: #5b6b80; font-size: 12px; margin: 0 0 12px; }
    .hidden { display: none !important; }
    @media print {
      body { background: #fff; }
      .page { padding: 0; max-width: none; }
      .toolbar, .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="hint">Order confirmation from RS Pet Stop - shared by our team / Messenger assistant.</p>
    <div id="statusMessage" class="status-message">Loading receipt...</div>
    <div id="docContainer"></div>
    <div class="toolbar hidden" id="toolbar">
      <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <!-- Same anon-key client every public page uses (order-now.html, track-driver.html) - no login here, this
       page is opened from a link sent to the customer on Messenger. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/orderDocument.js?v=1"></script>
  <script>
    async function loadReceipt() {
      const orderId = new URLSearchParams(window.location.search).get('order');
      const statusEl = document.getElementById('statusMessage');
      if (!orderId) {
        statusEl.textContent = 'No order number given - open this page from the link we shared.';
        return;
      }

      const [{ data, error }, info] = await Promise.all([
        supabaseClient.rpc('public_get_order_receipt', { p_order_no: orderId }),
        fetchCompanyInfo()
      ]);
      if (error) {
        statusEl.textContent = 'Could not load this receipt right now - please try again shortly.';
        return;
      }
      if (!data || data.length === 0) {
        statusEl.textContent = `No order found matching "${orderId}".`;
        return;
      }

      statusEl.classList.add('hidden');
      document.title = renderOrderDocument(document.getElementById('docContainer'), data, info, 'confirmation');
      document.getElementById('toolbar').classList.remove('hidden');
    }

    loadReceipt();
  </script>
</body>
</html>
