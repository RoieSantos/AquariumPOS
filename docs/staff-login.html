<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RS Pet Stop Portal - Sign In</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body class="login-backdrop">
  <div class="centered-page">
    <div class="login-card">
      <h1 style="text-align:center;">RS Pet Stop Portal</h1>
      <p class="muted" style="text-align:center; margin-top:-8px;">Staff sign in</p>

      <button type="button" id="biometricLoginBtn" class="btn btn-primary hidden" style="width:100%; margin-bottom:16px;">Sign In with Face ID / Fingerprint</button>
      <p id="biometricDivider" class="muted hidden" style="text-align:center; margin:-8px 0 16px;">or sign in with password</p>

      <form id="loginForm">
        <div class="form-row">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        <div id="loginError" class="error-text hidden"></div>
      </form>

      <p class="muted" style="text-align:center; margin-top:16px; margin-bottom:0;">
        <a href="index.html">&larr; Back to rspetstop.com</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/webauthnAuth.js"></script>
  <script src="js/companyBranding.js"></script>
  <script>
    (function () {
      const existingSession = getPortalSession();
      if (existingSession) {
        window.location.href = existingSession.mustChangePassword ? 'change-password.html' : 'dashboard.html';
      }
    })();

    applyLoginBackground();

    (async function initBiometricLogin() {
      const hasEnrollment = getStoredBiometricCredentials().length > 0;
      if (!hasEnrollment || !(await isBiometricAvailable())) return;

      document.getElementById('biometricLoginBtn').classList.remove('hidden');
      document.getElementById('biometricDivider').classList.remove('hidden');
    })();

    document.getElementById('biometricLoginBtn').addEventListener('click', async (event) => {
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('hidden');

      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Waiting for Face ID / Fingerprint...';

      const result = await loginWithBiometric();

      btn.disabled = false;
      btn.textContent = 'Sign In with Face ID / Fingerprint';

      if (!result.success) {
        errorEl.textContent = result.message;
        errorEl.classList.remove('hidden');
        return;
      }

      const session = getPortalSession();
      window.location.href = session?.mustChangePassword ? 'change-password.html' : 'dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById('loginError');
      errorEl.classList.add('hidden');

      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const result = await attemptLogin(username, password);

      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';

      if (!result.success) {
        errorEl.textContent = result.message;
        errorEl.classList.remove('hidden');
        return;
      }

      const session = getPortalSession();
      window.location.href = session?.mustChangePassword ? 'change-password.html' : 'dashboard.html';
    });
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
