<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Pet Stop - Payment Receipt</title>
  <!-- One Xendit online payment (payment-receipt.html?id=<PaymentID>) - public_get_xendit_payment_receipt,
       sql/supabase_xendit_payment_receipt_page.sql. Same letterhead / sheet styles as the Order
       Confirmation (css/orderDocument.css + js/orderDocument.js helpers). -->
  <link rel="stylesheet" href="css/orderDocument.css?v=1">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      color: #1f2a37;
      font-size: 13px;
    }
    .page { max-width: 820px; margin: 0 auto; padding: 20px 14px 32px; }
    .status-message {
      background: #fff; border: 1px solid #c9d3e1; border-radius: 8px;
      padding: 18px; text-align: center; color: #5b6b80;
    }
    .toolbar { text-align: center; margin-top: 16px; }
    .toolbar button {
      background: #1d4f91; color: #fff; border: none; border-radius: 6px;
      padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hint { text-align: center; color: #5b6b80; font-size: 12px; margin: 0 0 12px; }
    .hidden { display: none !important; }
    .pr-test { background: #fff4d6; border: 1px solid #f0c36d; color: #7a5300; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; text-align: center; font-weight: 600; }
    .pr-amount { font-size: 26px; font-weight: 700; color: #15803d; margin: 6px 0 2px; }
    .pr-amount-label { color: #5b6b80; font-size: 12px; }
    .pr-grid { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-top: 10px; }
    .pr-grid b { color: #1f2a37; }
    .pr-footnote { color: #5b6b80; font-size: 11px; margin-top: 8px; }
    @media print {
      body { background: #fff; }
      .page { padding: 0; max-width: none; }
      .toolbar, .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="hint">Payment receipt from RS Pet Stop - sent to you after your online payment.</p>
    <div id="statusMessage" class="status-message">Loading receipt...</div>
    <div id="docContainer"></div>
    <div class="toolbar hidden" id="toolbar">
      <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/orderDocument.js?v=regaddr1"></script>
  <script>
    function prPeso(value) {
      return '&#8369; ' + Number(value || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function prDateTime(value) {
      if (!value) return '';
      return new Date(value).toLocaleString('en-PH', { timeZone: 'Asia/Manila', year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function renderPaymentReceipt(container, p, info) {
      const items = Array.isArray(p.items) ? p.items : [];
      const itemsHtml = items.length === 0
        ? '<tr><td colspan="4" style="color:#5b6b80;">No items on this order.</td></tr>'
        : items.map((it, i) => `
            <tr>
              <td class="od-idx">${i + 1}</td>
              <td><span class="od-line-name">${odEsc(it.name || '')}</span></td>
              <td class="od-qty">${odEsc(it.qty ?? '')}</td>
              <td class="od-num">${odPeso(it.amount)}</td>
            </tr>`).join('');
      const balance = Number(p.balance || 0);

      container.innerHTML = `
        ${p.is_test ? '<div class="pr-test">TEST PAYMENT - no real money was received.</div>' : ''}
        <div class="od-sheet">
          <div class="od-row">
            <div class="od-cell">${odLetterheadHtml(info)}</div>
            <div class="od-cell">
              <div class="od-order-no">Receipt #${odEsc(p.receipt_no || '')}</div>
              ${odKv('Date paid', prDateTime(p.paid_at))}
              ${odKv('Order', p.order_ref)}
              ${p.order_status ? `<span class="od-chip">${odEsc(p.order_status)}</span>` : ''}
            </div>
          </div>

          <div class="od-row od-single">
            <div class="od-cell">
              <div class="od-title">PAYMENT RECEIPT</div>
              <div class="pr-amount-label">Amount received</div>
              <div class="pr-amount">${prPeso(p.amount)}</div>
              <div class="pr-grid">
                <span>Received from</span><b>${odEsc(p.customer_name || '-')}</b>
                <span>Payment for</span><b>${odEsc(p.purpose || '')} - Order ${odEsc(p.order_ref || '')}</b>
                <span>Paid via</span><b>${odEsc(p.paid_via || '')}</b>
                <span>Xendit reference</span><b>${odEsc(p.xendit_reference || '-')}</b>
              </div>
            </div>
          </div>

          <div class="od-row od-single">
            <div style="min-width:0;">
              <table class="od-lines">
                <thead><tr><th class="od-idx">#</th><th>Order items</th><th class="od-qty">Qty</th><th class="od-num">Amount</th></tr></thead>
                <tbody>${itemsHtml}</tbody>
              </table>
            </div>
          </div>

          <div class="od-row">
            <div class="od-cell od-notice">
              <p>Thank you for your payment! Please keep this receipt for your records.</p>
              <p class="pr-footnote">This acknowledges your online payment through Xendit. It is not a BIR Official Receipt / Sales Invoice.</p>
            </div>
            <div class="od-cell od-totals">
              <div class="od-t-row od-net"><span>Order Total</span><span>${prPeso(p.order_total)}</span></div>
              <div class="od-t-row"><span>This Payment</span><span>${prPeso(p.amount)}</span></div>
              <div class="od-t-row"><span>Total Paid to Date</span><span>${prPeso(p.total_paid)}</span></div>
              <div class="od-t-row od-balance${balance <= 0 ? ' od-paid' : ''}"><span>Balance</span><span class="od-v">${prPeso(balance)}</span></div>
            </div>
          </div>
        </div>`;
    }

    async function loadPaymentReceipt() {
      const id = (new URLSearchParams(window.location.search).get('id') || '').trim();
      const statusEl = document.getElementById('statusMessage');
      if (!/^[0-9a-f-]{36}$/i.test(id)) {
        statusEl.textContent = 'This receipt link is incomplete - please open it from the message we sent you.';
        return;
      }
      const [{ data, error }, info] = await Promise.all([
        supabaseClient.rpc('public_get_xendit_payment_receipt', { p_payment_id: id }),
        fetchCompanyInfo()
      ]);
      if (error) {
        statusEl.textContent = 'Could not load this receipt right now - please try again shortly.';
        return;
      }
      if (!data || data.length === 0) {
        statusEl.textContent = 'No payment found for this receipt link.';
        return;
      }
      statusEl.classList.add('hidden');
      // The order's branch registered address on the letterhead (Warehouse Setup).
      const letterhead = await orderLetterheadInfo(info, data[0].order_ref);
      renderPaymentReceipt(document.getElementById('docContainer'), data[0], letterhead);
      document.title = `Payment Receipt #${data[0].receipt_no} - RS Pet Stop`;
      document.getElementById('toolbar').classList.remove('hidden');
    }

    loadPaymentReceipt();
  </script>
</body>
</html>
