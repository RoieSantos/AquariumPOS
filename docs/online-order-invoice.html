<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice - RS Pet Stop</title>
  <!-- PUBLIC page (opened from a link the assistant/staff shares with a customer, no login). Same sheet as
       the Order Confirmation (css/orderDocument.css + js/orderDocument.js), titled INVOICE. -->
  <link rel="stylesheet" href="css/orderDocument.css?v=1" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #eef2f7;
      color: #1f2a37;
      font-size: 13px;
    }
    .page { max-width: 820px; margin: 0 auto; padding: 20px 14px 32px; }
    .status-message {
      background: #fff; border: 1px solid #c9d3e1; border-radius: 8px;
      padding: 18px; text-align: center; color: #5b6b80;
    }
    .toolbar { text-align: center; margin-top: 16px; }
    .toolbar button {
      background: #1d4f91; color: #fff; border: none; border-radius: 6px;
      padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hint { text-align: center; color: #5b6b80; font-size: 12px; margin: 0 0 12px; }
    .hidden { display: none !important; }
    @media print {
      body { background: #fff; }
      .page { padding: 0; max-width: none; }
      .toolbar, .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="hint">Invoice - opened from a link shared by RS Pet Stop.</p>
    <div id="statusMessage" class="status-message">Loading invoice...</div>
    <div id="docContainer"></div>
    <div class="toolbar hidden" id="toolbar">
      <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <!-- Same anon-key client every public page uses (order-now.html, online-order-receipt.html). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/orderDocument.js?v=1"></script>
  <script src="js/onlineOrderInvoice.js?v=2"></script>
</body>
</html>
