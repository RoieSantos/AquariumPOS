<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice - RS Pet Stop</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    /* This is a PUBLIC page (opened from a link the assistant/staff shares with a customer, no
       login) - unlike gma-order-invoice.html's staff-only Sales Staff/phone fields, so no topnav
       and a narrower max-width, matching online-order-receipt.html's own lightweight page shell. */
    .page {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    .subtitle {
      margin: 0 0 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="subtitle no-print">Invoice - opened from a link shared by RS Pet Stop.</p>
    <div id="statusMessage" class="error-text">Loading invoice...</div>

    <div id="receiptContent" class="hidden">
      <div class="delivery-receipt">
        <div class="delivery-receipt-section invoice-header">
          <div class="delivery-receipt-header">
            <img id="receiptLogo" class="delivery-receipt-logo hidden" alt="Company logo" />
            <div class="delivery-receipt-company-info">
              <div id="receiptCompanyName" class="delivery-receipt-company-name"></div>
              <div id="receiptFacebook" class="delivery-receipt-line"></div>
              <div id="receiptAddress" class="delivery-receipt-line"></div>
              <div id="receiptContactNo" class="delivery-receipt-line"></div>
            </div>
          </div>
          <div class="invoice-order-info">
            <div id="receiptOrderNo" class="delivery-receipt-line"></div>
            <div id="receiptCreationDate" class="delivery-receipt-line"></div>
            <div id="receiptLocation" class="delivery-receipt-line"></div>
          </div>
        </div>

        <div class="delivery-receipt-section">
          <div id="receiptReceiverName" class="delivery-receipt-line"></div>
          <div id="receiptReceiverAddress" class="delivery-receipt-line"></div>
        </div>

        <div class="delivery-receipt-section">
          <div class="delivery-receipt-title">INVOICE</div>
        </div>

        <div class="delivery-receipt-section">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Products</th>
                  <th>Qty</th>
                  <th style="text-align:right;">Amount</th>
                </tr>
              </thead>
              <tbody id="receiptLinesBody"></tbody>
            </table>
          </div>
          <div id="receiptNote" class="delivery-receipt-note"></div>
        </div>

        <div class="delivery-receipt-section">
          <p>Thank you for choosing RSPETSTOP. Please settle your balance according to the payment terms stated above.</p>
          <p>We appreciate your trust in us! Happy Fish Keeping!</p>
        </div>

        <div class="delivery-receipt-section">
          <div class="invoice-summary">
            <div class="invoice-summary-row"><span>Total</span><span id="summaryTotal"></span></div>
            <div class="invoice-summary-row"><span>Amount Paid</span><span id="summaryAmountPaid"></span></div>
            <div class="invoice-summary-row invoice-summary-balance"><span>Balance</span><span id="summaryBalance"></span></div>
          </div>
        </div>
      </div>

      <div class="toolbar no-print" style="justify-content:center; margin-top:14px;">
        <button type="button" class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
      </div>
    </div>
  </div>

  <!-- Same anon-key client every public page uses (order-now.html, online-order-receipt.html) -
       no login here, this page is meant to be opened from a link staff/the assistant shares. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/onlineOrderInvoice.js"></script>
</body>
</html>
