<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Receipt - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav" class="no-print"></div>

  <div class="page">
    <div class="toolbar no-print">
      <a href="delivery.html">&larr; Back to Delivery</a>
      <button class="btn btn-primary" id="printBtn" type="button">Print</button>
    </div>

    <p id="printSummaryNote" class="muted no-print"></p>

    <div id="unlockBox" class="hidden no-print">
      <p class="error-text" id="unlockError"></p>
      <button class="btn btn-primary" id="unlockBtn" type="button">Log Out and Log Back In</button>
    </div>

    <div id="loadError" class="error-text hidden"></div>

    <!-- Filled entirely by js/deliveryReceipt.js's loadReceipt() - 2 Delivery Receipt copies
         always, plus 1 Invoice copy appended when the order has a Balance owing, each its own
         .print-page (see css/styles.css) so one Print click produces the whole bundle as a
         single correctly-paginated job. -->
    <div id="printArea" class="hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js?v=grouped2"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/deliveryReceipt.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
