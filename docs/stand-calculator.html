<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Stand - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=sky1" />
  <script src="js/theme.js?v=auto1"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
  <style>
    /* Calculator fills everything under the portal nav - the embedded page has its own title,
       step nav and sticky quote panel, so no extra heading/frame chrome here. */
    html,
    body {
      height: 100%;
    }

    body.calc-fullscreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body.calc-fullscreen #topnav {
      flex: 0 0 auto;
    }

    /* position + z-index so it paints above js/nightSkyBg.js's fixed background canvas, same as
       .page does in css/styles.css. */
    .calc-fullscreen-frame {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      display: block;
    }
  </style>
</head>
<body class="calc-fullscreen">
  <div id="topnav"></div>

  <iframe class="calc-fullscreen-frame" src="WebAquariumCalculator/stand.html" title="Custom Stand Calculator"></iframe>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js?v=all1"></script>
  <script src="js/nav.js?v=fbpost1"></script>
  <script>
    (async function () {
      const session = await requireAuth();
      if (!session) return;
      renderTopNav('Custom Stand');
    })();
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
