<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Calculator - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .calculator-frame-wrap {
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-top: 16px;
    }
    #calculatorFrame {
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 640px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="topnav"></div>

  <div class="page">
    <h1>Custom Calculator</h1>
    <p class="muted">
      Client-side calculator only - nothing here is saved to the database.
      This reuses the existing custom aquarium calculator.
    </p>
    <div class="calculator-frame-wrap">
      <iframe id="calculatorFrame" src="WebAquariumCalculator/index.html" title="Custom Aquarium Calculator"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    (async function () {
      const session = await requireAuth();
      if (!session) return;
      renderTopNav('Custom Calculator');
    })();
  </script>
</body>
</html>
