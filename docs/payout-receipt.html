<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payout Receipt - RS Pet Stop Portal</title>
  <!-- One salary / cash advance payout sent through Xendit (payout-receipt.html?id=<PayoutID>) -
       my_get_payout_receipt, sql/supabase_xendit_payout_receipts.sql. Employees see their own; payroll
       officers / super users see any. -->
  <link rel="stylesheet" href="css/styles.css?v=navgroups1" />
  <script src="js/theme.js?v=auto1"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
  <style>
    .pr-sheet { max-width: 640px; }
    .pr-test { background: #fff4d6; border: 1px solid #f0c36d; color: #7a5300; border-radius: 6px; padding: 8px 12px; margin: 10px 0; text-align: center; font-weight: 600; }
    .pr-unpaid { background: #fdecea; border: 1px solid #f1b0a8; color: #8a2a1e; border-radius: 6px; padding: 8px 12px; margin: 10px 0; text-align: center; font-weight: 600; }
    .pr-amount { font-size: 28px; font-weight: 700; color: var(--success); margin: 12px 0 0; }
    .pr-amount-label { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
    .pr-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin-top: 10px; }
    .pr-grid dt { color: var(--text-muted); }
    .pr-grid dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .pr-footnote { color: var(--text-muted); font-size: 11.5px; margin-top: 16px; }
    @media print {
      .pr-amount { color: #000; }
      .pr-grid dt, .pr-amount-label, .pr-footnote { color: #444; }
    }
  </style>
</head>
<body>
  <div id="topnav" class="no-print"></div>

  <div class="page">
    <div class="toolbar no-print">
      <a href="my-payslips.html" class="btn btn-secondary" id="backBtn">Back to My Payslips</a>
      <button class="btn btn-primary hidden" id="printBtn" type="button">Print / Save as PDF</button>
    </div>

    <div id="receiptError" class="error-text hidden"></div>

    <div id="printContent" class="pr-sheet hidden">
      <div id="companyLetterhead"></div>
      <h1 id="printTitle" style="margin-bottom:4px;">Payout Receipt</h1>
      <div id="receiptBanner"></div>
      <div class="pr-amount" id="receiptAmount"></div>
      <div class="pr-amount-label" id="receiptAmountLabel"></div>
      <dl class="pr-grid" id="receiptGrid"></dl>
      <div id="receiptMatch"></div>
      <div id="receiptRefs"></div>
      <p class="pr-footnote">
        Sent by RS Pet Stop through Xendit. If you can't find it in your account, tell your payroll officer - they
        can trace it with Xendit using the numbers above.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js?v=payoutreceipt1"></script>
  <script src="js/nav.js?v=payoutnotice1"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/payoutReceipt.js?v=4"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
