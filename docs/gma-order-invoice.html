<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=sky1" />
  <link rel="stylesheet" href="css/orderDocument.css?v=1" />
  <style>
    /* Same sheet as the Order Confirmation (css/orderDocument.css) - kept white on the dark theme too. */
    .gma-invoice-doc { max-width: 820px; margin: 0 auto; }
    @media print { .gma-invoice-doc { max-width: none; } }
  </style>
  <script src="js/theme.js?v=auto1"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav" class="no-print"></div>

  <div class="page">
    <div class="toolbar no-print">
      <a href="gma-conversations.html">&larr; Back to Conversations</a>
      <button class="btn btn-primary" id="printBtn" type="button">Print</button>
    </div>

    <div id="unlockBox" class="hidden no-print">
      <p class="error-text" id="unlockError"></p>
      <button class="btn btn-primary" id="unlockBtn" type="button">Log Out and Log Back In</button>
    </div>

    <div id="loadError" class="error-text hidden"></div>

    <div id="docContainer" class="gma-invoice-doc"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>

  <script src="js/nav.js?v=fbpost1"></script>
  <script src="js/companyBranding.js"></script>

  <script src="js/gmaOrderInvoice.js?v=3"></script>
  <script src="js/pwa.js"></script>

</html>
