<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Purchase Order - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav" class="no-print"></div>

  <div class="page">
    <div class="toolbar no-print">
      <a href="purchase-orders.html" class="btn btn-secondary">Back to Purchase Orders</a>
      <button class="btn btn-primary" id="printBtn" type="button">Print</button>
    </div>

    <div id="poContent" class="hidden">
      <div id="companyLetterhead"></div>
      <h1>Purchase Order</h1>
      <p class="muted" id="poSubtitle"></p>

      <div class="form-grid">
        <div class="form-row">
          <label>PO No.</label>
          <div id="poNo" class="muted"></div>
        </div>
        <div class="form-row">
          <label>Vendor</label>
          <div id="poVendor" class="muted"></div>
        </div>
        <!-- Header warehouse (supabase_purchase_order_header_warehouse.sql) - the printed PO has
             to say which branch the goods are for, since that is what the vendor delivers to. -->
        <div class="form-row">
          <label>Warehouse</label>
          <div id="poWarehouse" class="muted"></div>
        </div>
        <div class="form-row">
          <label>Order Date</label>
          <div id="poDate" class="muted"></div>
        </div>
        <!-- Payment Method (supabase_purchase_order_payment_method.sql) - so the printed copy kept
             with the vendor's receipt also says how it was paid. -->
        <div class="form-row">
          <label>Payment Method</label>
          <div id="poPaymentMethod" class="muted"></div>
        </div>
        <div class="form-row">
          <label>Notes</label>
          <div id="poNotes" class="muted"></div>
        </div>
      </div>

      <div class="section-divider"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item Code</th>
              <!-- The vendor's own code for the item (ItemVendors."VendorItemNo") - shown only
                   when at least one line on this order has one, so a PO to a vendor who has never
                   given you their codes does not print an empty column. -->
              <th id="poVendorItemNoHeader" class="hidden">Vendor Item No.</th>
              <th>Item Name</th>
              <th>Description</th>
              <th style="text-align:right;">Quantity</th>
              <th style="text-align:right;">Unit Cost</th>
              <th style="text-align:right;">Line Cost</th>
            </tr>
          </thead>
          <tbody id="poLinesBody"></tbody>
          <tfoot>
            <tr>
              <!-- colspan is widened by one in js/purchaseOrderPrint.js when the Vendor Item No.
                   column is shown, so the total stays under Line Cost. -->
              <td id="poTotalCostLabel" colspan="5" style="text-align:right; font-weight:600;">Total Cost</td>
              <td id="poTotalCost" style="text-align:right; font-weight:600;">0.00</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="print-signature-row">
        <div class="print-signature-block">
          <div class="print-signature-line"></div>
          <div class="print-signature-label">Prepared By</div>
        </div>
        <div class="print-signature-block">
          <div class="print-signature-line"></div>
          <div class="print-signature-label">Approved By</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js?v=grouped2"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/purchaseOrderPrint.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
