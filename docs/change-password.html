<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav"></div>

  <div class="page" style="max-width:480px;">
    <h1>Change Your Password</h1>
    <p class="muted" id="changePasswordIntro">Please set a new password to continue.</p>

    <div class="card">
      <form id="changePasswordForm">
        <div class="form-row">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" autocomplete="current-password" required />
        </div>
        <div class="form-row">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" autocomplete="new-password" required />
        </div>
        <div class="form-row">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Change Password</button>
        <div id="changePasswordError" class="error-text hidden"></div>
        <div id="changePasswordSuccess" class="success-text hidden"></div>
      </form>
      <p class="muted" style="margin-top:16px; text-align:center;">
        Not ready? <a href="#" id="changePasswordLogoutLink">Log out</a> instead.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js?v=grouped2"></script>
  <script src="js/changePassword.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
