<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variant Setup - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="topnav"></div>

  <div class="page">
    <h1>Variant Setup</h1>
    <p class="muted">Read-only view of product Variants synced from Pancake. Only visible to super users.</p>

    <!-- Not authorized -->
    <div id="notAuthorizedBox" class="hidden">
      <p class="error-text">You do not have access to this page. Ask a super user to grant you access.</p>
    </div>

    <!-- Shown only if the session was created before login started capturing the password
         (edge case - existing logged-in users before this update); a fresh login fixes it.
         No password re-entry prompt otherwise - super user status alone is enough, same trust
         model as Online Orders/Expenses. -->
    <div id="unlockBox" class="hidden">
      <p class="error-text" id="unlockError"></p>
      <button class="btn btn-primary" id="unlockBtn" type="button">Log Out and Log Back In</button>
    </div>

    <!-- Main content, shown once unlocked -->
    <div id="setupContent" class="hidden">
      <div class="toolbar">
        <h2 style="margin:0;">Variants</h2>
        <div style="display:flex; gap:12px; align-items:center;">
          <input type="text" id="variantSearchInput" placeholder="Search by item code, name or SKU..." style="max-width:280px;" />
        </div>
      </div>
      <p class="muted" id="filterNote"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Main Item Code</th>
              <th>Linked Item Code</th>
              <th>Variant Name</th>
              <th>SKU</th>
              <th>Category</th>
              <th>Price</th>
              <th>Last Synced</th>
            </tr>
          </thead>
          <tbody id="variantTableBody">
            <tr><td colspan="7" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="variantPaginationBar"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/variantSetup.js"></script>
</body>
</html>
