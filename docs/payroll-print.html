<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payslip - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=grouped2" />
  <script src="js/theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav" class="no-print"></div>

  <div class="page">
    <div class="toolbar no-print">
      <a href="payroll.html" class="btn btn-secondary">Back to Payroll</a>
      <button class="btn btn-primary" id="printBtn" type="button">Print</button>
    </div>

    <div id="printContent">
      <div id="companyLetterhead"></div>
      <h1 id="printTitle">Payslip</h1>
      <p class="muted" id="printSubtitle"></p>

      <div class="form-grid" id="payslipSummary"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Label</th>
              <th style="text-align:right;">Amount</th>
            </tr>
          </thead>
          <tbody id="printTableBody"></tbody>
        </table>
      </div>

      <div class="print-signature-row">
        <div class="print-signature-block">
          <div class="print-signature-line"></div>
          <div class="print-signature-label">Prepared By</div>
        </div>
        <div class="print-signature-block">
          <div class="print-signature-line"></div>
          <div class="print-signature-label">Employee Signature</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js?v=grouped2"></script>
  <script src="js/companyBranding.js"></script>
  <script src="js/payrollPrint.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
