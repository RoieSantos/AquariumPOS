<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Payslips - RS Pet Stop Portal</title>
  <link rel="stylesheet" href="css/styles.css?v=navgroups1" />
  <script src="js/theme.js?v=auto1"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d4f91" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RS Pet Stop" />
</head>
<body>
  <div id="topnav"></div>

  <div class="page">
    <div class="toolbar">
      <div>
        <h1 style="margin-bottom:4px;">My Payslips</h1>
        <p class="muted">Your finalized pay for every completed payroll run.</p>
      </div>
    </div>

    <div id="payslipsError" class="error-text hidden"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pay Cycle</th>
            <th>Period</th>
            <th>Pay Date</th>
            <th style="text-align:right;">Base Pay</th>
            <th style="text-align:right;">Additions</th>
            <th style="text-align:right;">Deductions</th>
            <th style="text-align:right;">Net Pay</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payslipTableBody">
          <tr><td colspan="8" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="advanceReceiptsSection" class="hidden" style="margin-top:24px;">
      <h2 style="margin-bottom:4px;">Cash Advances Sent via Xendit</h2>
      <p class="muted">Each one is deducted from your next payroll run.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Advance Date</th>
              <th>Paid</th>
              <th>Sent To</th>
              <th style="text-align:right;">Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="advanceReceiptsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js?v=payoutreceipt1"></script>
  <script src="js/nav.js?v=aispend1"></script>
  <script src="js/myPayslips.js?v=receipt1"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
